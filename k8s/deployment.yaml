apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  labels: { app: sample-service }
spec:
  replicas: 3
  selector:
    matchLabels: { app: sample-service }
  template:
    metadata:
      labels: { app: sample-service }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
